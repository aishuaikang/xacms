log:
    # DebugLevel -1
    # InfoLevel 0
    # WarnLevel 1
    # ErrorLevel 2
    # DPanicLevel 3
    # PanicLevel 4
    # FatalLevel 5
    level: 0
    # Silent 1
    # Error 2
    # Warn 3
    # Info 4
    databaseLevel: 4
    enabled: true
database:
    name: "spbatc.db"

server:
    port: 8100

# account:
#     init-password: 123456

jwt:
    singingKey: uav_defender_key_123456
    expiresTime: 7d
    bufferTime: 1d
    issuer: uav_defender

configuration:
    # # 1关使用侦测设备默认的gps 2开使用专用的gps模块
    # gpsSwitch: 1
    # # 1测向开 2 侧向关
    # orientationSwitch: 2

    # fpv服务
    fpvPort: 10000
    # gps服务
    gpsPort: 10001
    #解析服务
    parsePort: 10002
    # 打击服务
    strikePort: 10003

    # 刷新时间(建议10秒以上）
    ttl: 60
    # # 扫频间隔(必须带.0)
    # similarThreshold: 15.0
    # # 锁频间隔
    # lockFrequency: 5
    # # 侧向策略 1-定向后侧向 2-直接侧向
    # lateralStrategy: 1
    # #侧率 1 关 2开
    # lateralStrategySwitch: 1
